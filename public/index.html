<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#007bff" />
  <title>Canlı Sohbet</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f0f2f5; --card: #ffffff; --text: #1a1a1a; --text-muted: #666;
      --border: #e5e5e5; --primary: #007bff; --primary-dark: #0056b3;
      --mine: #d1e7ff; --shadow: rgba(0,0,0,0.08); --dm: #fff4d6;
    }
    body.dark {
      --bg: #0f1720; --card: #1a2634; --text: #e8eaed; --text-muted: #8a95a4;
      --border: #2a3a4a; --primary: #4a9eff; --primary-dark: #2a7fff;
      --mine: #1e3a5f; --shadow: rgba(0,0,0,0.3); --dm: #4a3f1f;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Arial, sans-serif;
      margin: 0; background: var(--bg); color: var(--text);
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    header {
      background: var(--primary); color: white; padding: 10px 14px;
      box-shadow: 0 2px 6px var(--shadow); z-index: 10; flex-shrink: 0;
    }
    .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    header h1 { font-size: 16px; margin: 0; }
    header .status { font-size: 13px; opacity: 0.9; }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    .icon-btn {
      background: rgba(255,255,255,0.15); border: 0; color: white;
      width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; padding: 0;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.25); }
    .icon-btn img { width: 100%; height: 100%; object-fit: cover; }
    .rooms-tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; align-items: center; }
    .rooms-tabs::-webkit-scrollbar { display: none; }
    .room-tab {
      padding: 6px 14px; border-radius: 16px; background: rgba(255,255,255,0.15);
      color: white; border: 0; font-size: 13px; cursor: pointer; white-space: nowrap; font-weight: 500;
    }
    .room-tab:hover { background: rgba(255,255,255,0.28); }
    .room-tab.active { background: white; color: var(--primary); font-weight: bold; }
    .room-tab.add { background: rgba(255,255,255,0.25); font-size: 16px; padding: 4px 12px; }
    .room-tab.owned { border-bottom: 2px solid rgba(255,255,255,0.7); }

    #usersPanel {
      position: fixed; top: 0; right: 0; width: 280px; height: 100vh;
      background: var(--card); box-shadow: -2px 0 12px var(--shadow);
      transform: translateX(100%); transition: transform 0.25s ease;
      z-index: 20; display: flex; flex-direction: column;
    }
    #usersPanel.open { transform: translateX(0); }
    #usersPanel .panel-header {
      padding: 16px; border-bottom: 1px solid var(--border);
      font-weight: bold; display: flex; justify-content: space-between; align-items: center;
    }
    #usersPanel ul { list-style: none; padding: 8px; margin: 0; overflow-y: auto; flex: 1; }
    #usersPanel li {
      padding: 10px 12px; border-radius: 8px; display: flex; align-items: center;
      gap: 10px; font-size: 15px; cursor: pointer;
    }
    #usersPanel li:hover { background: var(--bg); }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-weight: bold;
      color: white; font-size: 14px; flex-shrink: 0;
      overflow: hidden; position: relative;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .avatar .status-dot {
      position: absolute; bottom: 0; right: 0;
      width: 11px; height: 11px; border-radius: 50%;
      border: 2px solid var(--card);
    }
    .status-dot.online { background: #2ecc71; }
    .status-dot.away { background: #f39c12; }
    .status-dot.busy { background: #e74c3c; }

    .user-info { display: flex; flex-direction: column; flex: 1; }
    .user-room { font-size: 11px; color: var(--text-muted); }

    #overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 15;
    }
    #overlay.show { opacity: 1; pointer-events: auto; }

    #messages {
      flex: 1; overflow-y: auto; list-style: none; padding: 16px; margin: 0;
      display: flex; flex-direction: column; gap: 10px;
    }
    #messages li {
      padding: 8px 14px; background: var(--card); border-radius: 16px;
      max-width: 78%; word-wrap: break-word; box-shadow: 0 1px 3px var(--shadow);
      align-self: flex-start; animation: slideIn 0.2s ease;
      position: relative; display: flex; gap: 10px; align-items: flex-start;
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #messages li.mine { background: var(--mine); align-self: flex-end; flex-direction: row-reverse; }
    #messages li.system {
      background: transparent; box-shadow: none; color: var(--text-muted);
      font-size: 13px; text-align: center; align-self: center;
      max-width: 100%; font-style: italic; display: block;
    }
    #messages li.dm { background: var(--dm); }
    #messages li .msg-avatar {
      width: 32px; height: 32px; border-radius: 50%; overflow: hidden;
      flex-shrink: 0; display: flex; align-items: center;
      justify-content: center; color: white; font-weight: bold; font-size: 13px;
    }
    #messages li .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
    #messages li .msg-body { flex: 1; min-width: 0; }
    #messages li .msg-header {
      display: flex; align-items: center; gap: 6px; font-size: 12px;
      color: var(--text-muted); margin-bottom: 4px;
    }
    #messages li .msg-header .name { font-weight: bold; }
    #messages li .msg-text { font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
    #messages li .msg-text img.gif { max-width: 220px; border-radius: 10px; display: block; margin-top: 4px; }
    #messages li .msg-text img.upload { max-width: 260px; border-radius: 10px; display: block; margin-top: 4px; cursor: pointer; }
    #messages li .msg-text a.file-link {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 14px; background: var(--bg); border-radius: 8px;
      color: var(--primary); text-decoration: none; margin-top: 4px; font-size: 14px;
      border: 1px solid var(--border);
    }
    #messages li .msg-text a.file-link:hover { background: var(--primary); color: white; }

    .seen-tick { font-size: 11px; margin-left: 6px; color: var(--text-muted); user-select: none; }
    .seen-tick.seen { color: #2ecc71; }

    #typing {
      height: 22px; padding: 0 16px; font-size: 13px;
      color: var(--text-muted); font-style: italic; flex-shrink: 0;
    }

    form {
      display: flex; gap: 6px; padding: 10px; background: var(--card);
      border-top: 1px solid var(--border); flex-shrink: 0;
      align-items: center;
    }
    .input-btn {
      background: transparent; border: 0; font-size: 22px; cursor: pointer;
      padding: 6px 8px; border-radius: 50%; line-height: 1;
    }
    .input-btn:hover { background: var(--bg); }
    input#input {
      flex: 1; padding: 12px 16px; border: 1px solid var(--border);
      border-radius: 22px; font-size: 16px; outline: none;
      background: var(--bg); color: var(--text); min-width: 0;
    }
    input#input:focus { border-color: var(--primary); }
    button.send {
      padding: 12px 18px; border: 0; border-radius: 22px;
      background: var(--primary); color: white; font-size: 15px;
      font-weight: 600; cursor: pointer;
    }
    button.send:active { transform: scale(0.96); }
    button.send:disabled { opacity: 0.5; cursor: not-allowed; }

    #emojiPanel {
      position: absolute; bottom: 70px; left: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: 0 4px 20px var(--shadow);
      padding: 10px; max-width: 320px; max-height: 280px; overflow-y: auto;
      z-index: 15;
      display: none;
      grid-template-columns: repeat(8, 1fr);
      gap: 4px;
    }
    #emojiPanel.show { display: grid; }
    #emojiPanel span {
      font-size: 22px; cursor: pointer; padding: 4px; border-radius: 6px;
      text-align: center; line-height: 1;
    }
    #emojiPanel span:hover { background: var(--bg); }

    #gifPanel {
      position: absolute; bottom: 70px; right: 10px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; box-shadow: 0 4px 20px var(--shadow);
      padding: 10px; width: 340px; max-width: 90vw; height: 380px;
      display: none; z-index: 15;
      flex-direction: column; gap: 8px;
    }
    #gifPanel.show { display: flex; }
    #gifSearch {
      padding: 8px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 14px; background: var(--bg); color: var(--text);
      width: 100%;
    }
    #gifResults {
      flex: 1; overflow-y: auto;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
    }
    #gifResults img {
      width: 100%; border-radius: 8px; cursor: pointer;
      transition: transform 0.15s;
    }
    #gifResults img:hover { transform: scale(1.05); }
    #gifResults .empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 20px; grid-column: span 2; }

    #connStatus {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      padding: 8px 16px; border-radius: 20px; font-size: 13px;
      background: #f39c12; color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: none; z-index: 25;
    }
    #connStatus.show { display: block; }
    #connStatus.reconnected { background: #2ecc71; }

    #modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center; z-index: 30;
    }
    #modal.show { display: flex; }
    #modal .box {
      background: var(--card); padding: 24px; border-radius: 14px;
      width: 90%; max-width: 360px;
    }
    #modal h3 { margin: 0 0 12px; }
    #modal input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border);
      border-radius: 8px; font-size: 15px; background: var(--bg); color: var(--text);
    }
    #modal .actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
    #modal button {
      padding: 10px 16px; border-radius: 8px; border: 0; cursor: pointer; font-weight: 600;
    }
    #modal .cancel { background: var(--bg); color: var(--text); }
    #modal .confirm { background: var(--primary); color: white; }

    #profilePanel {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      display: none; align-items: center; justify-content: center; z-index: 30;
    }
    #profilePanel.show { display: flex; }
    #profilePanel .box {
      background: var(--card); padding: 24px; border-radius: 14px;
      width: 90%; max-width: 380px; text-align: center;
    }
    #profilePanel .avatar-preview {
      width: 100px; height: 100px; border-radius: 50%;
      margin: 0 auto 16px; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: bold; color: white;
      background: #007bff;
    }
    #profilePanel .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    #profilePanel h3 { margin: 0 0 8px; }
    #profilePanel .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
    #profilePanel .upload-btn {
      display: inline-block; padding: 10px 18px; background: var(--primary);
      color: white; border-radius: 8px; cursor: pointer; font-weight: 600;
      font-size: 14px; margin-bottom: 8px;
    }
    #profilePanel .upload-btn:hover { background: var(--primary-dark); }
    #profilePanel input[type=file] { display: none; }
    #profilePanel .status-row {
      display: flex; gap: 6px; justify-content: center; margin-top: 16px;
      border-top: 1px solid var(--border); padding-top: 16px;
    }
    #profilePanel .status-btn {
      padding: 6px 12px; border-radius: 16px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); cursor: pointer; font-size: 13px;
    }
    #profilePanel .status-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
    #profilePanel .close-btn {
      margin-top: 16px; padding: 10px 18px; background: var(--bg); color: var(--text);
      border: 0; border-radius: 8px; cursor: pointer; font-weight: 600;
    }

    #dmBar {
      display: none; padding: 8px 14px; background: var(--dm);
      border-bottom: 1px solid var(--border); font-size: 14px;
      align-items: center; justify-content: space-between;
    }
    #dmBar.show { display: flex; }
    #dmBar button {
      background: transparent; border: 0; color: var(--text); cursor: pointer; font-size: 16px;
    }

    #roomMenu {
      position: fixed; display: none; background: var(--card);
      border: 1px solid var(--border); border-radius: 8px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.35); z-index: 40;
      padding: 6px; min-width: 180px;
    }
    #roomMenu button {
      display: block; width: 100%; padding: 10px 14px;
      background: transparent; border: 0; text-align: left;
      cursor: pointer; color: var(--text); font-size: 14px; border-radius: 6px;
    }
    #roomMenu button:hover { background: var(--bg); }
    #roomMenu #roomDelete { color: #e74c3c; }

    @media (max-width: 500px) {
      header h1 { font-size: 14px; }
      #messages { padding: 12px; }
      #messages li { max-width: 90%; }
      #usersPanel { width: 80%; }
      #gifPanel { width: 95vw; height: 60vh; }
      #emojiPanel { max-width: 95vw; grid-template-columns: repeat(7, 1fr); }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <h1>💬 Canlı Sohbet</h1>
      <div class="header-actions">
        <button class="icon-btn" id="profileBtn" title="Profil">👤</button>
        <span class="status" id="status">🟢 0</span>
        <button class="icon-btn" id="themeBtn" title="Tema">🌙</button>
        <button class="icon-btn" id="usersBtn" title="Kullanıcılar">👥</button>
      </div>
    </div>
    <div class="rooms-tabs" id="roomsTabs"></div>
  </header>

  <div id="dmBar">
    <span>🔒 <b id="dmWith"></b> ile özel sohbet</span>
    <button id="dmClose" title="Kapat">✕</button>
  </div>

  <ul id="messages"></ul>
  <div id="typing"></div>

  <form id="form">
    <button type="button" class="input-btn" id="emojiBtn" title="Emoji">😀</button>
    <button type="button" class="input-btn" id="gifBtn" title="GIF">🎬</button>
    <button type="button" class="input-btn" id="fileBtn" title="Dosya">📎</button>
    <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
    <button type="submit" class="send" id="sendBtn">Gönder</button>
  </form>

  <input type="file" id="fileInput" style="display:none" />

  <div id="emojiPanel"></div>

  <div id="gifPanel">
    <input id="gifSearch" placeholder="GIF ara..." />
    <div id="gifResults"></div>
  </div>

  <div id="connStatus">Bağlantı koptu, yeniden bağlanılıyor...</div>

  <div id="overlay"></div>

  <aside id="usersPanel">
    <div class="panel-header">
      <span>👥 Çevrimiçi</span>
      <button class="icon-btn" id="closeUsersBtn" style="background:transparent;color:var(--text);">✕</button>
    </div>
    <ul id="usersList"></ul>
  </aside>

  <div id="modal">
    <div class="box">
      <h3>➕ Yeni Oda Oluştur</h3>
      <input id="newRoomInput" placeholder="oda-adi (harf, rakam, -, _)" maxlength="20" />
      <div class="actions">
        <button class="cancel" id="modalCancel">İptal</button>
        <button class="confirm" id="modalConfirm">Oluştur</button>
      </div>
    </div>
  </div>

  <div id="profilePanel">
    <div class="box">
      <div class="avatar-preview" id="avatarPreview">👤</div>
      <h3 id="profileName">Kullanıcı</h3>
      <div class="sub">Profil fotoğrafını değiştir</div>
      <label class="upload-btn" for="avatarInput">📷 Fotoğraf Yükle</label>
      <input type="file" id="avatarInput" accept="image/*" />
      <div class="status-row" id="statusRow">
        <button class="status-btn" data-status="online">🟢 Çevrimiçi</button>
        <button class="status-btn" data-status="away">🟡 Uzakta</button>
        <button class="status-btn" data-status="busy">🔴 Meşgul</button>
      </div>
      <button class="close-btn" id="profileClose">Kapat</button>
    </div>
  </div>

  <div id="roomMenu">
    <button id="roomRename">✏️ Yeniden Adlandır</button>
    <button id="roomDelete">🗑️ Sil</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io({
      reconnection: true, reconnectionAttempts: Infinity,
      reconnectionDelay: 1000, reconnectionDelayMax: 5000, timeout: 20000
    });

    const $ = id => document.getElementById(id);
    const form = $('form'), input = $('input'), sendBtn = $('sendBtn');
    const messages = $('messages'), typingEl = $('typing'), statusEl = $('status');
    const usersList = $('usersList'), usersPanel = $('usersPanel');
    const overlay = $('overlay'), themeBtn = $('themeBtn'), roomsTabs = $('roomsTabs');
    const modal = $('modal'), newRoomInput = $('newRoomInput');
    const dmBar = $('dmBar'), dmWith = $('dmWith');
    const connStatus = $('connStatus');
    const emojiBtn = $('emojiBtn'), emojiPanel = $('emojiPanel');
    const gifBtn = $('gifBtn'), gifPanel = $('gifPanel');
    const gifSearch = $('gifSearch'), gifResults = $('gifResults');
    const profileBtn = $('profileBtn'), profilePanel = $('profilePanel');
    const avatarPreview = $('avatarPreview'), profileName = $('profileName');
    const avatarInput = $('avatarInput'), statusRow = $('statusRow');
    const profileClose = $('profileClose');
    const roomMenu = $('roomMenu');
    const fileBtn = $('fileBtn'), fileInput = $('fileInput');

    const DEFAULT_ROOMS = ['genel', 'oyun', 'spor', 'sohbet'];

    let username = localStorage.getItem('chat_username');
    while (!username || !username.trim()) {
      username = prompt('Kullanıcı adın (bir daha sormayacağım):');
      if (username !== null) username = username.trim().slice(0, 20);
    }
    localStorage.setItem('chat_username', username);
    profileName.textContent = username;

    let currentRoom = 'genel';
    let dmTarget = null;
    let typingTimer;
    let myAvatar = null;
    let myStatus = 'online';
    let menuRoom = null;

    // ==================== BAĞLANTI ====================
    socket.on('connect', () => {
      sendBtn.disabled = false;
      connStatus.classList.remove('show');
      socket.emit('set username', username);
    });
    socket.on('disconnect', () => {
      sendBtn.disabled = true;
      connStatus.textContent = 'Bağlantı koptu, yeniden bağlanılıyor...';
      connStatus.className = 'show';
    });
    socket.on('reconnect', () => {
      connStatus.textContent = '✅ Yeniden bağlandı';
      connStatus.className = 'show reconnected';
      setTimeout(() => connStatus.classList.remove('show', 'reconnected'), 2000);
    });

    // ==================== ME ====================
    socket.on('me', (data) => {
      myAvatar = data.avatar;
      myStatus = data.status || 'online';
      updateProfileUI();
    });

    function updateProfileUI() {
      if (myAvatar) {
        avatarPreview.innerHTML = '<img src="' + escapeHtml(myAvatar) + '" />';
        profileBtn.innerHTML = '<img src="' + escapeHtml(myAvatar) + '" />';
      } else {
        avatarPreview.textContent = username[0].toUpperCase();
        avatarPreview.style.background = colorFor(username);
        profileBtn.textContent = '👤';
      }
      document.querySelectorAll('.status-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.status === myStatus);
      });
    }

    // ==================== TEMA ====================
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') { document.body.classList.add('dark'); themeBtn.textContent = '☀️'; }
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeBtn.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // ==================== PROFİL ====================
    profileBtn.addEventListener('click', () => { profilePanel.classList.add('show'); updateProfileUI(); });
    profileClose.addEventListener('click', () => profilePanel.classList.remove('show'));
    profilePanel.addEventListener('click', (e) => { if (e.target === profilePanel) profilePanel.classList.remove('show'); });

    avatarInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 5 * 1024 * 1024) { alert('Dosya 5 MB\'dan küçük olmalı'); return; }
      const fd = new FormData();
      fd.append('avatar', file);
      try {
        const res = await fetch('/api/avatar?username=' + encodeURIComponent(username), { method: 'POST', body: fd });
        const data = await res.json();
        if (data.error) alert('Hata: ' + data.error);
        else { myAvatar = data.url; updateProfileUI(); }
      } catch (err) { alert('Yükleme hatası: ' + err.message); }
      avatarInput.value = '';
    });

    statusRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.status-btn');
      if (!btn) return;
      socket.emit('set status', btn.dataset.status);
      myStatus = btn.dataset.status;
      updateProfileUI();
    });

    // ==================== KULLANICI PANELİ ====================
    $('usersBtn').addEventListener('click', () => { usersPanel.classList.add('open'); overlay.classList.add('show'); });
    $('closeUsersBtn').addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);
    function closePanel() { usersPanel.classList.remove('open'); overlay.classList.remove('show'); }

    // ==================== ODALAR ====================
    socket.on('rooms list', (rooms) => {
      roomsTabs.innerHTML = '';
      rooms.forEach(r => {
        const room = r.name, owner = r.owner;
        const btn = document.createElement('button');
        btn.className = 'room-tab' + (room === currentRoom && !dmTarget ? ' active' : '');
        if (owner === username) btn.classList.add('owned');
        btn.textContent = '#' + room;
        btn.dataset.room = room;
        btn.addEventListener('click', () => switchRoom(room));

        // Masaüstü: sağ tık
        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (DEFAULT_ROOMS.includes(room)) return;
          if (owner !== username) return;
          openRoomMenu(e.clientX, e.clientY, room);
        });

        // Mobil: uzun bas
        let pressTimer;
        btn.addEventListener('touchstart', (e) => {
          if (DEFAULT_ROOMS.includes(room)) return;
          if (owner !== username) return;
          pressTimer = setTimeout(() => {
            const t = e.touches[0];
            openRoomMenu(t.clientX, t.clientY, room);
          }, 600);
        });
        btn.addEventListener('touchend', () => clearTimeout(pressTimer));
        btn.addEventListener('touchmove', () => clearTimeout(pressTimer));

        roomsTabs.appendChild(btn);
      });

      const addBtn = document.createElement('button');
      addBtn.className = 'room-tab add';
      addBtn.textContent = '＋';
      addBtn.addEventListener('click', () => {
        modal.classList.add('show'); newRoomInput.value = ''; newRoomInput.focus();
      });
      roomsTabs.appendChild(addBtn);
    });

    function openRoomMenu(x, y, room) {
      menuRoom = room;
      roomMenu.style.display = 'block';
      roomMenu.style.left = x + 'px';
      roomMenu.style.top = y + 'px';
      const rect = roomMenu.getBoundingClientRect();
      if (rect.right > window.innerWidth) roomMenu.style.left = (window.innerWidth - rect.width - 8) + 'px';
      if (rect.bottom > window.innerHeight) roomMenu.style.top = (window.innerHeight - rect.height - 8) + 'px';
    }

    document.addEventListener('click', () => { roomMenu.style.display = 'none'; });

    $('roomRename').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!menuRoom) return;
      const yeni = prompt('Yeni oda adı:', menuRoom);
      if (yeni && yeni.trim() && yeni.trim() !== menuRoom) {
        socket.emit('rename room', { oldName: menuRoom, newName: yeni.trim() });
      }
      roomMenu.style.display = 'none';
    });

    $('roomDelete').addEventListener('click', (e) => {
      e.stopPropagation();
      if (!menuRoom) return;
      if (confirm('"#' + menuRoom + '" odası silinsin mi? Tüm mesajlar kaybolacak.')) {
        socket.emit('delete room', menuRoom);
      }
      roomMenu.style.display = 'none';
    });

    socket.on('current room', (room) => {
      currentRoom = room;
      if (!dmTarget) {
        document.querySelectorAll('.room-tab').forEach(tab => {
          tab.classList.toggle('active', tab.dataset.room === room);
        });
        input.placeholder = '#' + room + ' odasına yaz...';
      }
    });

    function switchRoom(room) {
      if (room === currentRoom && !dmTarget) return;
      closeDM();
      socket.emit('join room', room);
      messages.innerHTML = '';
      typingEl.textContent = '';
    }

    $('modalCancel').addEventListener('click', () => modal.classList.remove('show'));
    $('modalConfirm').addEventListener('click', () => {
      const name = newRoomInput.value.trim();
      if (name) socket.emit('create room', name);
      modal.classList.remove('show');
    });
    newRoomInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') $('modalConfirm').click(); });

    // ==================== GEÇMİŞ ====================
    socket.on('history', (data) => {
      if (data.room !== currentRoom || dmTarget) return;
      messages.innerHTML = '';
      data.messages.forEach(msg => renderMessage({
        id: msg.id, user: msg.username, text: msg.text, time: msg.time,
        dm: false, seen: msg.seen, avatar: msg.avatar
      }, false));
      messages.scrollTop = messages.scrollHeight;
    });

    // ==================== MESAJ GÖNDER ====================
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      if (!socket.connected) { alert('Bağlantı yok'); return; }
      if (dmTarget) socket.emit('dm message', { to: dmTarget, text });
      else socket.emit('chat message', { text });
      input.value = '';
      socket.emit('stop typing');
    });

    input.addEventListener('input', () => {
      if (!socket.connected) return;
      socket.emit('typing');
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => socket.emit('stop typing'), 1200);
    });

    // ==================== DOSYA GÖNDER ====================
    fileBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (file.size > 10 * 1024 * 1024) { alert('Dosya 10 MB\'dan küçük olmalı'); fileInput.value = ''; return; }

      const fd = new FormData();
      fd.append('file', file);
      try {
        const res = await fetch('/api/upload', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.error) { alert('Hata: ' + data.error); return; }

        const text = data.isImage ? ('[img]' + data.url) : ('[file]' + data.url + '|' + data.name);
        if (dmTarget) socket.emit('dm message', { to: dmTarget, text });
        else socket.emit('chat message', { text });
      } catch (err) {
        alert('Yükleme hatası: ' + err.message);
      }
      fileInput.value = '';
    });

    // ==================== SES ====================
    function playNotification() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(); osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    // ==================== EMOJI ====================
    const EMOJIS = ['😀','😃','😄','😁','😆','😅','😂','🤣','😊','😇','🙂','🙃','😉','😌','😍','🥰','😘','😗','😙','😚','😋','😛','😝','😜','🤪','🤨','🧐','🤓','😎','🤩','🥳','😏','😒','😞','😔','😟','😕','🙁','☹️','😣','😖','😫','😩','🥺','😢','😭','😤','😠','😡','🤬','🤯','😳','🥵','🥶','😱','😨','😰','😥','😓','🤗','🤔','🤭','🤫','🤥','😶','😐','😑','😬','🙄','😯','😦','😧','😮','😲','🥱','😴','🤤','😪','😵','🤐','🥴','🤢','🤮','🤧','😷','🤒','🤕','🤑','🤠','😈','👿','👹','👺','🤡','💩','👻','💀','☠️','👽','👾','🤖','🎃','😺','😸','😹','😻','😼','😽','🙀','😿','😾','❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔','❣️','💕','💞','💓','💗','💖','💘','💝','💟','👍','👎','👌','✌️','🤞','🤟','🤘','🤙','👈','👉','👆','👇','☝️','✋','🤚','🖐','🖖','👋','🤝','🙏','✍️','💪','🦾','🔥','⭐','🌟','✨','⚡','💥','💫','💦','💨','🎉','🎊','🎈','🎁','🎂','🍰','🧁','🍕','🍔','🍟','🌭','🍿','🍩','🍪','☕','🍵','🍺','🍻','🍷','🥂','🍸','🥤','🧃','🍎','🍌','🍇','🍓','🍒','🍑','🥭','🍍','🥝','🍅','🥑','🥦','🥕','🌽','🌶','🥒','🥬','🧄','🧅','🍄','🥜','🍞','🥐','🥖','🥨','🧀','🥚','🍳','🥞','🧇','🥓','🍗','🍖','🌮','🌯','🥙','🧆','🥘','🍝','🍜','🍲','🍛','🍣','🍱','🥟','🍤','🍙','🍚','🍘','🍥','🥠','🥮','🍢','🍡','🍧','🍨','🍦','🥧','⚽','🏀','🏈','⚾','🥎','🎾','🏐','🏉','🥏','🎱','🏓','🏸','🏒','🏑','🥍','🏏','🥅','⛳','🎣','🥊','🥋','🎽','🛹','⛸','🎿','🏂','🏋️','🤸','🧘','🏄','🏊','🚴','🏆','🥇','🥈','🥉','🏅','🎖','🎗','🎫','🎟','🎪','🤹','🎭','🎨','🎬','🎤','🎧','🎼','🎹','🥁','🎷','🎺','🎸','🪕','🎻','🎲','🎯','🎳','🎮','🎰','🧩'];

    EMOJIS.forEach(e => {
      const sp = document.createElement('span');
      sp.textContent = e;
      sp.addEventListener('click', () => { input.value += e; input.focus(); });
      emojiPanel.appendChild(sp);
    });

    emojiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      emojiPanel.classList.toggle('show');
      gifPanel.classList.remove('show');
    });

    // ==================== GIF ====================
    let gifLoaded = false;
    gifBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      gifPanel.classList.toggle('show');
      emojiPanel.classList.remove('show');
      if (gifPanel.classList.contains('show') && !gifLoaded) { gifLoaded = true; searchGifs('trending'); }
    });

    let gifTimer;
    gifSearch.addEventListener('input', () => {
      clearTimeout(gifTimer);
      gifTimer = setTimeout(() => searchGifs(gifSearch.value.trim() || 'trending'), 400);
    });

    async function searchGifs(q) {
      gifResults.innerHTML = '<div class="empty">Yükleniyor...</div>';
      try {
        const res = await fetch('/api/gifs?q=' + encodeURIComponent(q) + '&limit=20');
        const data = await res.json();
        if (data.error) { gifResults.innerHTML = '<div class="empty">⚠️ ' + data.error + '</div>'; return; }
        const results = data.results || [];
        if (!results.length) { gifResults.innerHTML = '<div class="empty">Sonuç yok</div>'; return; }
        gifResults.innerHTML = '';
        results.forEach(g => {
          const url = g.media_formats?.tinygif?.url || g.media_formats?.gif?.url;
          if (!url) return;
          const img = document.createElement('img');
          img.src = url; img.loading = 'lazy';
          img.addEventListener('click', () => sendGif(url));
          gifResults.appendChild(img);
        });
      } catch (err) { gifResults.innerHTML = '<div class="empty">Hata: ' + err.message + '</div>'; }
    }

    function sendGif(url) {
      const text = '[gif]' + url;
      if (dmTarget) socket.emit('dm message', { to: dmTarget, text });
      else socket.emit('chat message', { text });
      gifPanel.classList.remove('show');
    }

    document.addEventListener('click', (e) => {
      if (!emojiPanel.contains(e.target) && e.target !== emojiBtn) emojiPanel.classList.remove('show');
      if (!gifPanel.contains(e.target) && e.target !== gifBtn) gifPanel.classList.remove('show');
    });

    // ==================== MESAJLAR ====================
    socket.on('chat message', (data) => {
      if (data.room !== currentRoom || dmTarget) return;
      renderMessage({ id: data.id, user: data.user, text: data.text, time: data.time, dm: false, seen: data.seen, avatar: data.avatar }, true);
    });

    socket.on('dm message', (data) => {
      const partner = data.from === username ? data.to : data.from;
      if (dmTarget === partner) {
        renderMessage({ id: data.id, user: data.from, text: data.text, time: data.time, dm: true, seen: data.seen, avatar: data.avatar }, true);
        if (data.from !== username && data.id) socket.emit('dm seen', data.id);
      } else { playNotification(); }
    });

    socket.on('dm seen', (msgId) => {
      const el = document.querySelector('[data-msg-id="' + msgId + '"] .seen-tick');
      if (el) { el.textContent = '✓✓'; el.classList.add('seen'); }
    });

    socket.on('dm history', (data) => {
      if (dmTarget !== data.with) return;
      messages.innerHTML = '';
      data.messages.forEach(msg => {
        renderMessage({ id: msg.id, user: msg.username, text: msg.text, time: msg.time, dm: true, seen: msg.seen, avatar: msg.avatar }, false);
      });
      messages.scrollTop = messages.scrollHeight;
    });

    function renderMessage(data, playSound) {
      const isMine = data.user === username;
      const li = document.createElement('li');
      if (isMine) li.classList.add('mine');
      if (data.dm) li.classList.add('dm');
      if (data.id) li.setAttribute('data-msg-id', data.id);

      const av = document.createElement('div');
      av.className = 'msg-avatar';
      if (data.avatar) av.innerHTML = '<img src="' + escapeHtml(data.avatar) + '" />';
      else { av.style.background = colorFor(data.user); av.textContent = data.user[0].toUpperCase(); }

      let textHtml;
      if (data.text.startsWith('[gif]')) {
        textHtml = '<img class="gif" src="' + escapeHtml(data.text.slice(5)) + '" loading="lazy" />';
      } else if (data.text.startsWith('[img]')) {
        textHtml = '<img class="upload" src="' + escapeHtml(data.text.slice(5)) + '" loading="lazy" />';
      } else if (data.text.startsWith('[file]')) {
        const rest = data.text.slice(6);
        const idx = rest.indexOf('|');
        const url = idx >= 0 ? rest.slice(0, idx) : rest;
        const name = idx >= 0 ? rest.slice(idx + 1) : 'dosya';
        textHtml = '<a class="file-link" href="' + escapeHtml(url) + '" download>📎 ' + escapeHtml(name) + '</a>';
      } else {
        textHtml = escapeHtml(data.text);
      }

      let tickHtml = '';
      if (isMine && data.dm && data.id) {
        tickHtml = '<span class="seen-tick' + (data.seen ? ' seen' : '') + '">' + (data.seen ? '✓✓' : '✓') + '</span>';
      }

      const body = document.createElement('div');
      body.className = 'msg-body';
      body.innerHTML =
        '<div class="msg-header">' +
          '<span class="name" style="color:' + (isMine ? 'var(--text)' : colorFor(data.user)) + '">' +
            escapeHtml(data.user) + (data.dm ? ' 🔒' : '') +
          '</span>' + tickHtml +
        '</div>' +
        '<div class="msg-text">' + textHtml + '</div>';

      li.appendChild(av);
      li.appendChild(body);
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;

      if (playSound && !isMine) playNotification();
    }

    socket.on('system message', (text) => {
      if (dmTarget) return;
      const li = document.createElement('li');
      li.classList.add('system');
      li.textContent = text;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    });

    socket.on('error message', (t) => alert('⚠️ ' + t));
    socket.on('typing', (u) => { typingEl.textContent = u + ' yazıyor...'; });
    socket.on('stop typing', () => { typingEl.textContent = ''; });

    // ==================== KULLANICI LİSTESİ ====================
    socket.on('users list', (users) => {
      statusEl.textContent = '🟢 ' + users.length;
      usersList.innerHTML = '';
      users.forEach(u => {
        const li = document.createElement('li');
        const av = document.createElement('div');
        av.className = 'avatar';
        if (u.avatar) av.innerHTML = '<img src="' + escapeHtml(u.avatar) + '" />';
        else { av.style.background = colorFor(u.username); av.textContent = u.username[0].toUpperCase(); }
        const dot = document.createElement('span');
        dot.className = 'status-dot ' + (u.status || 'online');
        av.appendChild(dot);

        const info = document.createElement('div');
        info.className = 'user-info';
        info.innerHTML = '<span>' + escapeHtml(u.username) +
                         (u.username === username ? ' (sen)' : '') + '</span>' +
                         '<span class="user-room">#' + u.room + '</span>';

        li.appendChild(av);
        li.appendChild(info);
        if (u.username !== username) li.addEventListener('click', () => openDM(u.username));
        usersList.appendChild(li);
      });
    });

    function openDM(target) {
      dmTarget = target;
      dmWith.textContent = target;
      dmBar.classList.add('show');
      messages.innerHTML = '';
      document.querySelectorAll('.room-tab').forEach(t => t.classList.remove('active'));
      input.placeholder = target + ' kişisine özel mesaj...';
      socket.emit('open dm', target);
      closePanel();
    }

    function closeDM() {
      dmTarget = null;
      dmBar.classList.remove('show');
      document.querySelectorAll('.room-tab').forEach(tab => {
        tab.classList.toggle('active', tab.dataset.room === currentRoom);
      });
      input.placeholder = '#' + currentRoom + ' odasına yaz...';
    }

    $('dmClose').addEventListener('click', () => {
      closeDM();
      socket.emit('join room', currentRoom);
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && !socket.connected) socket.connect();
    });

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function colorFor(name) {
      const colors = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f39c12', '#1abc9c', '#e91e63', '#3f51b5'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }
  </script>
</body>
</html>
