<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#007bff" />
  <title>Canlı Sohbet</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1a1a1a;
      --text-muted: #666;
      --border: #e5e5e5;
      --primary: #007bff;
      --primary-dark: #0056b3;
      --mine: #d1e7ff;
      --shadow: rgba(0,0,0,0.08);
    }

    body.dark {
      --bg: #0f1720;
      --card: #1a2634;
      --text: #e8eaed;
      --text-muted: #8a95a4;
      --border: #2a3a4a;
      --primary: #4a9eff;
      --primary-dark: #2a7fff;
      --mine: #1e3a5f;
      --shadow: rgba(0,0,0,0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      transition: background 0.2s, color 0.2s;
      overflow: hidden;
    }

    /* ÜST BAR */
    header {
      background: var(--primary);
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px var(--shadow);
      z-index: 10;
      flex-shrink: 0;
    }

    header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
    header .status { font-size: 13px; opacity: 0.9; display: flex; align-items: center; gap: 6px; }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      background: rgba(255,255,255,0.15);
      border: 0;
      color: white;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .icon-btn:hover { background: rgba(255,255,255,0.25); }

    /* KULLANICI LİSTESİ PANELİ */
    #usersPanel {
      position: fixed;
      top: 0;
      right: 0;
      width: 260px;
      height: 100vh;
      background: var(--card);
      box-shadow: -2px 0 12px var(--shadow);
      transform: translateX(100%);
      transition: transform 0.25s ease;
      z-index: 20;
      display: flex;
      flex-direction: column;
    }

    #usersPanel.open { transform: translateX(0); }

    #usersPanel .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #usersPanel ul {
      list-style: none;
      padding: 8px;
      margin: 0;
      overflow-y: auto;
      flex: 1;
    }

    #usersPanel li {
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
    }

    #usersPanel li:hover { background: var(--bg); }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: white;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* OVERLAY */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 15;
    }

    #overlay.show { opacity: 1; pointer-events: auto; }

    /* MESAJLAR */
    #messages {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 16px;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #messages li {
      padding: 8px 14px;
      background: var(--card);
      border-radius: 16px;
      max-width: 78%;
      word-wrap: break-word;
      box-shadow: 0 1px 3px var(--shadow);
      align-self: flex-start;
      animation: slideIn 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    #messages li.mine {
      background: var(--mine);
      align-self: flex-end;
    }

    #messages li.system {
      background: transparent;
      box-shadow: none;
      color: var(--text-muted);
      font-size: 13px;
      text-align: center;
      align-self: center;
      max-width: 100%;
      font-style: italic;
    }

    #messages li .msg-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }

    #messages li .msg-header .name {
      font-weight: bold;
      color: var(--primary);
    }

    #messages li .msg-text {
      font-size: 15px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    /* YAZIYOR GÖSTERGESİ */
    #typing {
      height: 22px;
      padding: 0 16px;
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      flex-shrink: 0;
    }

    /* FORM */
    form {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: var(--card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    input#input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 22px;
      font-size: 16px;
      outline: none;
      background: var(--bg);
      color: var(--text);
      transition: border-color 0.15s;
    }

    input#input:focus { border-color: var(--primary); }

    button.send {
      padding: 12px 22px;
      border: 0;
      border-radius: 22px;
      background: var(--primary);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button.send:hover { background: var(--primary-dark); }
    button.send:active { transform: scale(0.96); }

    /* MOBİL */
    @media (max-width: 500px) {
      header h1 { font-size: 15px; }
      #messages { padding: 12px; }
      #messages li { max-width: 85%; }
      #usersPanel { width: 80%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>💬 Canlı Sohbet</h1>
    <div class="header-actions">
      <span class="status" id="status">🟢 0</span>
      <button class="icon-btn" id="themeBtn" title="Tema">🌙</button>
      <button class="icon-btn" id="usersBtn" title="Kullanıcılar">👥</button>
    </div>
  </header>

  <ul id="messages"></ul>
  <div id="typing"></div>

  <form id="form">
    <input id="input" autocomplete="off" placeholder="Mesaj yaz..." />
    <button type="submit" class="send">Gönder</button>
  </form>

  <div id="overlay"></div>

  <aside id="usersPanel">
    <div class="panel-header">
      <span>👥 Çevrimiçi</span>
      <button class="icon-btn" id="closeUsersBtn" style="background:transparent;color:var(--text);">✕</button>
    </div>
    <ul id="usersList"></ul>
  </aside>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messages = document.getElementById('messages');
    const typingEl = document.getElementById('typing');
    const statusEl = document.getElementById('status');
    const usersList = document.getElementById('usersList');
    const usersPanel = document.getElementById('usersPanel');
    const overlay = document.getElementById('overlay');
    const themeBtn = document.getElementById('themeBtn');

    const username = prompt('Kullanıcı adın:')?.trim() || 'Anonim';
    socket.emit('set username', username);

    let typingTimer;

    // --- TEMA ---
    const savedTheme = localStorage.getItem('theme') || 'light';
    if (savedTheme === 'dark') {
      document.body.classList.add('dark');
      themeBtn.textContent = '☀️';
    }
    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      themeBtn.textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // --- KULLANICI PANELİ ---
    document.getElementById('usersBtn').addEventListener('click', () => {
      usersPanel.classList.add('open');
      overlay.classList.add('show');
    });
    document.getElementById('closeUsersBtn').addEventListener('click', closePanel);
    overlay.addEventListener('click', closePanel);
    function closePanel() {
      usersPanel.classList.remove('open');
      overlay.classList.remove('show');
    }

    // --- MESAJ GÖNDER ---
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat message', { user: username, text });
      input.value = '';
      socket.emit('stop typing');
    });

    // --- YAZIYOR ---
    input.addEventListener('input', () => {
      socket.emit('typing', username);
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => socket.emit('stop typing'), 1200);
    });

    // --- SES BİLDİRİMİ ---
    function playNotification() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 800;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    // --- GELEN MESAJ ---
    socket.on('chat message', (data) => {
      const isMine = data.user === username;
      const li = document.createElement('li');
      if (isMine) li.classList.add('mine');

      li.innerHTML = `
        <div class="msg-header">
          <span class="name" style="color:${isMine ? 'var(--text)' : colorFor(data.user)}">${escapeHtml(data.user)}</span>
        </div>
        <div class="msg-text">${escapeHtml(data.text)}</div>
      `;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;

      // Ses bildirimi (kendi mesajın değilse)
      if (!isMine) playNotification();
    });

    // --- SİSTEM MESAJI ---
    socket.on('system message', (text) => {
      const li = document.createElement('li');
      li.classList.add('system');
      li.textContent = text;
      messages.appendChild(li);
      messages.scrollTop = messages.scrollHeight;
    });

    // --- YAZIYOR ---
    socket.on('typing', (user) => { typingEl.textContent = `${user} yazıyor...`; });
    socket.on('stop typing', () => { typingEl.textContent = ''; });

    // --- KULLANICI LİSTESİ ---
    socket.on('users list', (users) => {
      statusEl.textContent = `🟢 ${users.length}`;
      usersList.innerHTML = '';
      users.forEach(u => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="avatar" style="background:${colorFor(u)}">${u[0].toUpperCase()}</div>
          <span>${escapeHtml(u)}${u === username ? ' (sen)' : ''}</span>
        `;
        usersList.appendChild(li);
      });
    });

    // --- YARDIMCI ---
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function colorFor(name) {
      const colors = ['#e74c3c', '#3498db', '#2ecc71', '#9b59b6', '#f39c12', '#1abc9c', '#e91e63', '#3f51b5'];
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      return colors[Math.abs(hash) % colors.length];
    }
  </script>
</body>
</html>
